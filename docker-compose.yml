name: rivon

x-app-env: &app-env
  RIVON_ENV: ${RIVON_ENV:-local}
  RIVON_DEPLOYMENT_REGION: ${RIVON_DEPLOYMENT_REGION:-eu}
  RIVON_DATABASE_URL: postgresql+asyncpg://rivon_app:${RIVON_DB_APP_PASSWORD:?}@postgres:5432/rivon
  RIVON_MIGRATION_DATABASE_URL: postgresql+asyncpg://rivon_owner:${RIVON_DB_OWNER_PASSWORD:?}@postgres:5432/rivon
  RIVON_REDIS_URL: redis://redis:6379/0
  RIVON_JWT_SECRET: ${RIVON_JWT_SECRET:?}
  RIVON_RELAY_DATABASE_URL: postgresql+asyncpg://rivon_relay:${RIVON_DB_RELAY_PASSWORD:?}@postgres:5432/rivon
  # Messaging channels. Optional locally: without them the connect endpoints
  # answer 503 rather than failing at runtime.
  RIVON_CHANNEL_TOKEN_KEY: ${RIVON_CHANNEL_TOKEN_KEY:-}
  RIVON_META_APP_ID: ${RIVON_META_APP_ID:-}
  RIVON_META_APP_SECRET: ${RIVON_META_APP_SECRET:-}
  RIVON_META_VERIFY_TOKEN: ${RIVON_META_VERIFY_TOKEN:-}
  RIVON_META_GRAPH_VERSION: ${RIVON_META_GRAPH_VERSION:-v25.0}
  RIVON_META_LOGIN_CONFIG_PAGES: ${RIVON_META_LOGIN_CONFIG_PAGES:-}
  RIVON_META_LOGIN_CONFIG_WHATSAPP: ${RIVON_META_LOGIN_CONFIG_WHATSAPP:-}
  RIVON_META_REDIRECT_URI: ${RIVON_META_REDIRECT_URI:-http://localhost:3000/connect/meta/callback}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      RIVON_DB_OWNER_PASSWORD: ${RIVON_DB_OWNER_PASSWORD:?}
      RIVON_DB_APP_PASSWORD: ${RIVON_DB_APP_PASSWORD:?}
      RIVON_DB_RELAY_PASSWORD: ${RIVON_DB_RELAY_PASSWORD:?}
    ports:
      - "5433:5432"  # 5433 on the host so a local Postgres on 5432 doesn't clash
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP: during first-run init the server only listens on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "rivon"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: rivon-api
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: rivon-api
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery worker. Locally one process consumes every queue; in production run
  # one worker pool per queue so slow AI or scheduled work never delays a reply.
  worker:
    build: .
    image: rivon-worker
    command: ["celery", "-A", "rivon.worker", "worker", "--loglevel=INFO",
              "-Q", "rivon.inbound,rivon.ai,rivon.outbound,rivon.scheduled"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Moves committed outbox events onto the Celery queues.
  relay:
    build: .
    image: rivon-worker
    command: ["python", "-m", "rivon.events.relay"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
