[project]
name = "rivon"
version = "0.1.0"
description = "AI lead qualification, feasibility and quotation for service SMEs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.6.3",
    "fastapi>=0.115",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.14.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
# Not an installable distribution: the app runs from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
